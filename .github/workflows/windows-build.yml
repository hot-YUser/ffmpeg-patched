name: windows build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'upstream commit to build (default: last verified)'
        required: false
        default: ''
      publish:
        description: 'publish a GitHub Release (otherwise artifact only)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: write

env:
  UPSTREAM: https://github.com/FFmpeg/FFmpeg.git

concurrency:
  group: windows-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make git diffutils zip
          pacboy: >-
            gcc:p pkgconf:p nasm:p
            x264:p x265:p libvpx:p dav1d:p aom:p svt-av1:p rav1e:p xvidcore:p
            opus:p lame:p libvorbis:p libtheora:p speex:p opencore-amr:p gsm:p
            libmysofa:p libbs2b:p rubberband:p
            libwebp:p openjpeg2:p fribidi:p libass:p zimg:p lcms2:p
            zlib:p xz:p bzip2:p libxml2:p gnutls:p srt:p librist:p SDL2:p

      - name: Clone upstream
        shell: msys2 {0}
        run: |
          set -eu
          REF='${{ inputs.ref }}'
          if [ -z "$REF" ] && [ -f state/last-good-upstream.txt ]; then
            REF=$(cat state/last-good-upstream.txt)
          fi
          if [ -n "$REF" ]; then
            git clone --filter=blob:none "$UPSTREAM" src
            git -C src checkout --detach "$REF"
          else
            git clone --depth 1 "$UPSTREAM" src
          fi
          git -C src log -1 --format='building upstream %H%n  %s'
          echo "UPSTREAM_SHA=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHORT=$(git -C src rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Apply patches
        shell: msys2 {0}
        run: |
          set -eu
          cd src
          git config user.name  'ffmpeg-patched CI'
          git config user.email 'ci@invalid.local'
          git am ../patches/*.patch
          git log --oneline -4

      # MSYS2 moves faster than FFmpeg does.  A distro side package change must
      # not silently produce a quieter binary, and must not kill the whole build
      # over a library this project does not depend on either.  So: probe every
      # pkg-config based library, report exactly what is missing and why, and
      # fail unless the missing ones are on the tolerated list.
      - name: Probe external libraries
        shell: msys2 {0}
        run: |
          set -u
          # ffmpeg-configure-flag:pkg-config-module
          PROBE='libx264:x264 libx265:x265 libvpx:vpx libdav1d:dav1d libaom:aom
                 libsvtav1:SvtAv1Enc librav1e:rav1e libopus:opus libvorbis:vorbis
                 libtheora:theora libspeex:speex librubberband:rubberband
                 libwebp:libwebp libopenjpeg:libopenjp2 libfribidi:fribidi
                 libass:libass libzimg:zimg libxml2:libxml-2.0 gnutls:gnutls
                 libsrt:srt librist:librist lcms2:lcms2 sdl2:sdl2'
          # Network and extra AV1 encoders: irrelevant to FFV1 and EXR.
          TOLERATE='librist srt rav1e'

          flags=''; dropped=''; fatal=''
          for pair in $PROBE; do
            flag=${pair%%:*}; mod=${pair##*:}
            if pkg-config --static --exists "$mod" 2>/dev/null; then
              printf '  ok    %-14s %s\n' "$mod" "$(pkg-config --modversion "$mod" 2>/dev/null)"
              flags="$flags --enable-$flag"
            else
              why=$(pkg-config --print-errors --static --exists "$mod" 2>&1 | head -2 | tr '\n' ' ')
              printf '  MISS  %-14s %s\n' "$mod" "$why"
              dropped="$dropped $mod"
              case " $TOLERATE " in *" $mod "*) ;; *) fatal="$fatal $mod";; esac
            fi
          done

          echo "EXTRA_ENABLE=$flags" >> "$GITHUB_ENV"
          echo "DROPPED_LIBS=$dropped" >> "$GITHUB_ENV"

          if [ -n "$dropped" ]; then
            echo "::warning::unresolved by pkg-config, dropped from this build:$dropped"
            { echo "### dropped libraries"; echo '`'"$dropped"'`'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$fatal" ]; then
            echo "::error::required libraries missing:$fatal"
            exit 1
          fi

      - name: Configure
        shell: msys2 {0}
        run: |
          set -eu
          cd src
          ./configure \
            --disable-doc \
            --enable-gpl --enable-version3 \
            --pkg-config-flags=--static --extra-ldflags=-static \
            --enable-libxvid --enable-libmp3lame \
            --enable-libopencore-amrnb --enable-libopencore-amrwb \
            --enable-libgsm --enable-libmysofa --enable-libbs2b \
            --enable-zlib --enable-lzma --enable-bzlib \
            $EXTRA_ENABLE \
            > configure.log 2>&1 || { tail -40 configure.log; exit 1; }
          # x265 and srt drag in -lgcc_s, which collides with -static
          # (multiple definition of _Unwind_*).  Drop it from the link line.
          sed -i 's/-lgcc_s//g' ffbuild/config.mak

      - name: Build
        shell: msys2 {0}
        run: |
          set -eu
          cd src
          make -j"$(nproc)" > build.log 2>&1 || {
            grep -iE 'multiple definition|undefined reference|cannot find -l|Error [0-9]' \
                 build.log | sort -u | head -20
            exit 1
          }
          ls -la ffmpeg.exe ffprobe.exe

      - name: Verify
        shell: msys2 {0}
        # /tmp, not $RUNNER_TEMP: the latter is a backslashed Windows path.
        run: tests/verify.sh src/ffmpeg.exe /tmp/v-win

      - name: Package
        shell: msys2 {0}
        run: |
          set -eu
          D=ffmpeg-patched-${UPSTREAM_SHORT}
          mkdir -p "$D"
          cp src/ffmpeg.exe src/ffprobe.exe "$D/"
          strip -s "$D/ffmpeg.exe" "$D/ffprobe.exe"
          cp -r patches "$D/patches"
          cp README.md "$D/"
          cat > "$D/BUILD-INFO.txt" <<EOF
          ffmpeg-patched, built by $GITHUB_REPOSITORY

          upstream commit : $UPSTREAM_SHA
          upstream source : https://code.ffmpeg.org/FFmpeg/FFmpeg
          patches applied : see the patches/ directory next to this file
          dropped libs    : ${DROPPED_LIBS:-none} (unresolved by pkg-config at build time)
          workflow run    : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          To reproduce, clone upstream at the commit above, "git am patches/*.patch",
          then configure with the flags recorded in "ffmpeg -version".

          These binaries are built with --enable-gpl --enable-version3 and are
          therefore covered by the GNU GPL v3.  The complete corresponding source
          is the upstream commit named above plus the patches shipped alongside.
          EOF
          zip -qr "$D.zip" "$D"
          ls -la "$D.zip"
          echo "PKG=$D" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip
          retention-days: 30

      - name: Publish release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${UPSTREAM_SHORT}" "${PKG}.zip" \
            --title "ffmpeg-patched @ ${UPSTREAM_SHORT}" \
            --notes "Static Windows build of upstream FFmpeg \`${UPSTREAM_SHA}\` with the FFV1 float and OpenEXR PIZ patches applied.

          Verified with \`tests/verify.sh\` before packaging. Complete corresponding source: the upstream commit above plus \`patches/\` inside the zip."
