name: windows build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'upstream commit to build (default: last verified)'
        required: false
        default: ''
      publish:
        description: 'publish a GitHub Release (otherwise artifact only)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: write

env:
  UPSTREAM: https://github.com/FFmpeg/FFmpeg.git

concurrency:
  group: windows-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make git diffutils zip
          pacboy: >-
            gcc:p pkgconf:p nasm:p
            x264:p x265:p libvpx:p dav1d:p aom:p svt-av1:p rav1e:p xvidcore:p
            opus:p lame:p libvorbis:p libtheora:p speex:p opencore-amr:p gsm:p
            libmysofa:p libbs2b:p rubberband:p
            libwebp:p openjpeg2:p fribidi:p libass:p zimg:p lcms2:p
            zlib:p xz:p bzip2:p libxml2:p gnutls:p srt:p librist:p SDL2:p

      - name: Clone upstream
        shell: msys2 {0}
        run: |
          set -eu
          REF='${{ inputs.ref }}'
          if [ -z "$REF" ] && [ -f state/last-good-upstream.txt ]; then
            REF=$(cat state/last-good-upstream.txt)
          fi
          if [ -n "$REF" ]; then
            git clone --filter=blob:none "$UPSTREAM" src
            git -C src checkout --detach "$REF"
          else
            git clone --depth 1 "$UPSTREAM" src
          fi
          git -C src log -1 --format='building upstream %H%n  %s'
          echo "UPSTREAM_SHA=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHORT=$(git -C src rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Apply patches
        shell: msys2 {0}
        run: |
          set -eu
          cd src
          git config user.name  'ffmpeg-patched CI'
          git config user.email 'ci@invalid.local'
          git am ../patches/*.patch
          git log --oneline -4

      # MSYS2 moves faster than FFmpeg does, and configure's library checks are
      # a compile-and-link test, not just a pkg-config lookup -- so nothing short
      # of running configure itself can predict them.  Run it, and if it rejects
      # a library that this project does not depend on, drop that one library and
      # try again.  Anything else is a hard failure, with ffbuild/config.log (the
      # file that holds the actual compiler error) dumped for diagnosis.
      - name: Configure
        shell: msys2 {0}
        run: |
          set -u
          cd src

          BASE="--disable-doc --enable-gpl --enable-version3
                --pkg-config-flags=--static --extra-ldflags=-static
                --enable-libxvid --enable-libmp3lame
                --enable-libopencore-amrnb --enable-libopencore-amrwb
                --enable-libgsm --enable-libmysofa --enable-libbs2b
                --enable-zlib --enable-lzma --enable-bzlib"

          OPT="--enable-libx264 --enable-libx265 --enable-libvpx --enable-libdav1d
               --enable-libaom --enable-libsvtav1 --enable-librav1e
               --enable-libopus --enable-libvorbis --enable-libtheora
               --enable-libspeex --enable-librubberband --enable-libwebp
               --enable-libopenjpeg --enable-libfribidi --enable-libass
               --enable-libzimg --enable-libxml2 --enable-gnutls --enable-libsrt
               --enable-librist --enable-lcms2 --enable-sdl2"

          # configure reports the pkg-config module name, which is not always the
          # flag name, so map them.  Only these may be dropped: RIST and SRT are
          # network transports and rav1e is a third AV1 encoder; none of them
          # affect FFV1 or EXR, which is what this build exists for.
          TOLERATE="librist:--enable-librist srt:--enable-libsrt rav1e:--enable-librav1e"

          dropped=""
          ok=no
          for attempt in 1 2 3 4; do
            if ./configure $BASE $OPT > configure.log 2>&1; then
              echo "configure succeeded on attempt $attempt"
              ok=yes
              break
            fi

            bad=$(sed -n 's/^ERROR: \([A-Za-z0-9_.+-]*\).*/\1/p' configure.log | head -1)
            flag=""
            for pair in $TOLERATE; do
              [ "${pair%%:*}" = "$bad" ] && flag="${pair##*:}"
            done

            if [ -z "$flag" ]; then
              echo "::error::configure rejected '$bad', which this build requires"
              echo "--- configure.log ---";      tail -25 configure.log
              echo "--- ffbuild/config.log ---"; tail -40 ffbuild/config.log 2>/dev/null
              exit 1
            fi

            echo "::warning::configure rejected '$bad'; dropping $flag and retrying"
            grep -E "^(ERROR|WARNING)" configure.log | head -3
            # Rebuild the list in shell: the flag starts with "--", which grep
            # would take as an option and silently return nothing, leaving a
            # build with no external libraries at all.
            before=$(echo $OPT | wc -w)
            keep=""
            for f in $OPT; do [ "$f" = "$flag" ] || keep="$keep $f"; done
            OPT=$keep
            after=$(echo $OPT | wc -w)
            if [ "$after" -ne $((before - 1)) ]; then
              echo "::error::flag removal went wrong: $before -> $after"; exit 1
            fi
            dropped="$dropped $bad"
          done

          if [ "$ok" != yes ]; then
            echo "::error::configure still failing after dropping:$dropped"
            tail -40 ffbuild/config.log 2>/dev/null
            exit 1
          fi

          echo "DROPPED_LIBS=${dropped# }" >> "$GITHUB_ENV"
          if [ -n "$dropped" ]; then
            { echo "### dropped libraries"; echo '`'"${dropped# }"'`'; } >> "$GITHUB_STEP_SUMMARY"
          fi

          # x265 and srt drag in -lgcc_s, which collides with -static
          # (multiple definition of _Unwind_*).  Drop it from the link line.
          sed -i 's/-lgcc_s//g' ffbuild/config.mak

      - name: Build
        shell: msys2 {0}
        run: |
          set -eu
          cd src
          make -j"$(nproc)" > build.log 2>&1 || {
            grep -iE 'multiple definition|undefined reference|cannot find -l|Error [0-9]' \
                 build.log | sort -u | head -20
            exit 1
          }
          ls -la ffmpeg.exe ffprobe.exe

      - name: Verify
        shell: msys2 {0}
        # /tmp, not $RUNNER_TEMP: the latter is a backslashed Windows path.
        run: tests/verify.sh src/ffmpeg.exe /tmp/v-win

      - name: Package
        shell: msys2 {0}
        run: |
          set -eu
          D=ffmpeg-patched-${UPSTREAM_SHORT}
          mkdir -p "$D"
          cp src/ffmpeg.exe src/ffprobe.exe "$D/"
          strip -s "$D/ffmpeg.exe" "$D/ffprobe.exe"
          cp -r patches "$D/patches"
          cp README.md "$D/"
          cat > "$D/BUILD-INFO.txt" <<EOF
          ffmpeg-patched, built by $GITHUB_REPOSITORY

          upstream commit : $UPSTREAM_SHA
          upstream source : https://code.ffmpeg.org/FFmpeg/FFmpeg
          patches applied : see the patches/ directory next to this file
          dropped libs    : ${DROPPED_LIBS:-none} (rejected by configure's link test)
          workflow run    : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          To reproduce, clone upstream at the commit above, "git am patches/*.patch",
          then configure with the flags recorded in "ffmpeg -version".

          These binaries are built with --enable-gpl --enable-version3 and are
          therefore covered by the GNU GPL v3.  The complete corresponding source
          is the upstream commit named above plus the patches shipped alongside.
          EOF
          zip -qr "$D.zip" "$D"
          ls -la "$D.zip"
          echo "PKG=$D" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip
          retention-days: 30

      - name: Publish release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${UPSTREAM_SHORT}" "${PKG}.zip" \
            --title "ffmpeg-patched @ ${UPSTREAM_SHORT}" \
            --notes "Static Windows build of upstream FFmpeg \`${UPSTREAM_SHA}\` with the FFV1 float and OpenEXR PIZ patches applied.

          Verified with \`tests/verify.sh\` before packaging. Complete corresponding source: the upstream commit above plus \`patches/\` inside the zip."
