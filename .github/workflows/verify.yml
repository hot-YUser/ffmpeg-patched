name: verify against upstream

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'patches/**'
      - 'tests/**'
      - '.github/workflows/verify.yml'

permissions:
  contents: write
  issues: write

env:
  # code.ffmpeg.org/FFmpeg/FFmpeg is canonical; this is its GitHub mirror and
  # is far faster to clone from a GitHub runner.
  UPSTREAM: https://github.com/FFmpeg/FFmpeg.git

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache nasm rsync

      - name: Clone upstream master
        run: |
          git clone --depth 1 "$UPSTREAM" src
          {
            echo "UPSTREAM_SHA=$(git -C src rev-parse HEAD)"
            echo "UPSTREAM_SHORT=$(git -C src rev-parse --short HEAD)"
          } >> "$GITHUB_ENV"
          git -C src log -1 --format='upstream %h %s'

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.UPSTREAM_SHA }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Cache fate samples
        uses: actions/cache@v5
        with:
          path: ~/fate-suite
          key: fate-suite-exr-v1

      # ------------------------------------------------------------------
      # 1. Pristine upstream.  Expected to FAIL verification -- that failure
      #    is what says the bugs are still there.  If it ever passes, upstream
      #    has fixed them and this repo has done its job.
      # ------------------------------------------------------------------
      - name: Build pristine upstream
        id: build_pristine
        run: tests/build-linux.sh src

      - name: Verify pristine upstream
        id: pristine
        run: |
          if tests/verify.sh src/ffmpeg "$RUNNER_TEMP/v-pristine"; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------------
      # 2. Apply the patches and rebuild.  ccache makes this second build
      #    cost little more than two recompiles and a relink.
      # ------------------------------------------------------------------
      - name: Apply patches
        id: apply
        if: steps.pristine.outputs.ok == 'false'
        run: |
          git -C src config user.name  'ffmpeg-patched CI'
          git -C src config user.email 'ci@invalid.local'
          if git -C src am "$GITHUB_WORKSPACE"/patches/*.patch; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            git -C src am --abort || true
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build patched
        id: build_patched
        if: steps.apply.outputs.ok == 'true'
        run: tests/build-linux.sh src

      - name: Verify patched
        id: patched
        if: steps.build_patched.outcome == 'success'
        run: |
          if tests/verify.sh src/ffmpeg "$RUNNER_TEMP/v-patched"; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------------
      # 3. FATE, as a regression net around the two touched decoders.
      # ------------------------------------------------------------------
      - name: FATE (fate-ffv1, fate-exr)
        id: fate
        if: steps.patched.outputs.ok == 'true'
        run: |
          set -o pipefail
          S=$HOME/fate-suite
          mkdir -p "$S/exr"
          rsync -rltLW --no-motd --timeout=60 \
                rsync://fate-suite.ffmpeg.org/fate-suite/exr/ "$S/exr/" \
            || echo "::warning::could not refresh fate samples, using cache"
          cp tests/assets/rgb_scanline_float_piz_dense_448x32.exr "$S/exr/"
          make -C src -j"$(nproc)" fate-ffv1 fate-exr SAMPLES="$S" 2>&1 | tee fate.log

          # Without SAMPLES, or with a missing component, a test is silently
          # dropped rather than failed -- a green make would prove nothing.
          # Assert both new tests actually ran.
          for t in ffv1-float-golomb exr-rgb-scanline-float-piz-dense; do
            grep -qE "^TEST[[:space:]]+$t\$" fate.log \
              || { echo "::error::fate test $t did not run"; exit 1; }
          done
          echo "fate: $(grep -c '^TEST' fate.log) tests ran"

      # ------------------------------------------------------------------
      # 4. Verdict.
      # ------------------------------------------------------------------
      - name: Verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_PRISTINE: ${{ steps.build_pristine.outcome }}
          PRISTINE: ${{ steps.pristine.outputs.ok }}
          APPLY: ${{ steps.apply.outputs.ok }}
          BUILD_PATCHED: ${{ steps.build_patched.outcome }}
          PATCHED: ${{ steps.patched.outputs.ok }}
          FATE: ${{ steps.fate.outcome }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # notify <title> <line>...   -- comments on an existing open issue
          # with the same title rather than opening a duplicate every day.
          notify () {
            title=$1; shift
            printf '%s\n' "$@" "" "$RUN_URL" > "$RUNNER_TEMP/body.md"
            n=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title == \"$title\") | .number" 2>/dev/null | head -1) || n=
            if [ -n "$n" ]; then
              gh issue comment "$n" --body-file "$RUNNER_TEMP/body.md"
            else
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
            fi
          }

          say () { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }
          say "upstream \`$UPSTREAM_SHA\`" ""

          # The build failing is a different thing from the patches being
          # wrong, and upstream master does occasionally not build.
          if [ "$BUILD_PRISTINE" != 'success' ]; then
            say "### could not build pristine upstream" \
                "Nothing was learned about the patches this run."
            notify "pristine upstream does not build" \
              "\`tests/build-linux.sh\` failed on unmodified upstream \`$UPSTREAM_SHA\`," \
              "before any patch was applied. Either upstream master is broken or the" \
              "build script needs updating. No conclusion about the patches this run."
            exit 1
          fi

          if [ "$PRISTINE" = 'true' ]; then
            say "### upstream appears fixed" \
                "Pristine \`$UPSTREAM_SHORT\` passes every check with no patches applied."
            notify "upstream passes without our patches" \
              "Pristine upstream \`$UPSTREAM_SHA\` passed \`tests/verify.sh\` with no patches" \
              "applied." "" \
              "Either the bugs were fixed upstream, or a check stopped being a real gate." \
              "Confirm which, then retire the corresponding patch."
            exit 0
          fi

          if [ "$APPLY" != 'true' ]; then
            say "### patches no longer apply"
            notify "patches no longer apply to upstream master" \
              "\`git am\` failed against upstream \`$UPSTREAM_SHA\`. Needs a human rebase."
            exit 1
          fi

          if [ "$BUILD_PATCHED" != 'success' ]; then
            say "### patched tree does not build"
            notify "patched tree does not build" \
              "The patches applied to \`$UPSTREAM_SHA\` without conflict, but the resulting" \
              "tree failed to compile. Upstream most likely changed something around the" \
              "patched code that \`git am\` could not see."
            exit 1
          fi

          if [ "$PATCHED" != 'true' ]; then
            say "### RED ALERT: patches apply but the output is wrong"
            notify "patches apply cleanly but output is wrong" \
              "The patches applied to upstream \`$UPSTREAM_SHA\` with no conflict, the tree" \
              "built, and the resulting binary FAILED \`tests/verify.sh\`." "" \
              "This is the failure mode a conflict check cannot see: upstream has most" \
              "likely fixed one of these bugs from the other side of the codec, so our" \
              "patch is now applying the correction a second time. **Do not ship this build.**"
            exit 1
          fi

          if [ "$FATE" != 'success' ]; then
            say "### FATE regression"
            notify "FATE regression against upstream master" \
              "\`tests/verify.sh\` passed but \`fate-ffv1\`/\`fate-exr\` did not, against" \
              "upstream \`$UPSTREAM_SHA\`."
            exit 1
          fi

          say "### good" \
              "Patches apply and the build passes every check against \`$UPSTREAM_SHORT\`."

      - name: Record last good upstream commit
        if: success() && steps.pristine.outputs.ok == 'false'
        run: |
          mkdir -p state
          echo "$UPSTREAM_SHA" > state/last-good-upstream.txt
          git add state/
          if ! git diff --cached --quiet; then
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "state: verified against upstream $UPSTREAM_SHORT"
            git push
          fi
